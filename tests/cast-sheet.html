<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Studio cast sheet</title>
<style>
  html, body { margin: 0; height: 100%; background: #efe9df; overflow: hidden; font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .name { position: absolute; font-size: 14px; font-weight: 600; color: #2b2b30; letter-spacing: 0.02em; }
  .val { position: absolute; font-size: 11px; color: #7a7266; transform: translateX(-50%); }
  .err { color: #c0392b; }
</style>
</head>
<body>
<div id="labels"></div>
<script type="module">
// Contact sheet for the studio cast: every actor twice (low + high value) under one shared light rig.
// Query params: ?v=0.3,0.8 (values per instance; a single value renders one instance)
//               ?only=clock,gauge  ?cols=5
import { STUDIO } from '../skills/explain-simulate-decide/engine/cast/index.js';
import { THREE } from '../skills/explain-simulate-decide/engine/cast/kit.js';

const q = new URLSearchParams(location.search);
const values = q.has('v') ? q.get('v').split(',').map(Number) : [0.15, 0.9];
const names = q.has('only') ? q.get('only').split(',') : Object.keys(STUDIO);
const cols = Number(q.get('cols')) || Math.min(5, names.length);
const rows = Math.ceil(names.length / cols);
window.sheetErrors = [];

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.setClearColor('#efe9df');
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#efe9df');
scene.add(new THREE.HemisphereLight('#fff8ee', '#d8c9b2', 1.6));
const sunLight = new THREE.DirectionalLight('#fff1dc', 2.4);
sunLight.position.set(4, 9, 7);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
Object.assign(sunLight.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.02;
sunLight.shadow.radius = 4;
scene.add(sunLight);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ color: '#5a4a35', opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const gap = values.length > 1 ? 3.1 : 0;
const cells = names.map((name) => {
  const instances = values.map((v, i) => {
    try {
      const actor = STUDIO[name]({ label: name });
      actor.object.position.x = (i - (values.length - 1) / 2) * gap;
      actor.setValue(v);
      return { actor, v };
    } catch (e) {
      console.error(`[${name}]`, e);
      window.sheetErrors.push(`${name}: ${e.message}`);
      return null;
    }
  });
  return { name, instances };
});

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const labels = document.getElementById('labels');

function render() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H);
  const cw = W / cols, ch = H / rows;
  camera.aspect = cw / ch;
  // fit all instances of a cell horizontally (each actor is ≤ 2.4 wide), never closer than a single actor needs
  const hHalf = Math.atan(Math.tan(THREE.MathUtils.degToRad(15)) * camera.aspect);
  const span = (values.length - 1) * gap + 3.0;
  const dist = Math.max(7.2, span / 2 / Math.tan(hHalf) + 1.2);
  camera.position.set(0, 3.4, dist);
  camera.lookAt(0, 1.25, 0);
  camera.updateProjectionMatrix();
  renderer.setScissorTest(true);
  labels.innerHTML = '';
  const tmp = new THREE.Vector3();
  cells.forEach((cell, idx) => {
    const c = idx % cols, r = Math.floor(idx / cols);
    const x = c * cw, yTop = r * ch;
    renderer.setViewport(x, H - yTop - ch, cw, ch);
    renderer.setScissor(x, H - yTop - ch, cw, ch);
    const live = cell.instances.filter(Boolean);
    live.forEach(({ actor }) => scene.add(actor.object));
    renderer.render(scene, camera);
    live.forEach(({ actor }) => scene.remove(actor.object));
    const name = document.createElement('div');
    name.className = 'name' + (live.length < cell.instances.length ? ' err' : '');
    name.textContent = cell.name;
    name.style.left = `${x + 14}px`;
    name.style.top = `${yTop + 10}px`;
    labels.appendChild(name);
    cell.instances.forEach((inst, i) => {
      if (!inst) return;
      tmp.set(inst.actor.object.position.x, -0.25, 0.6).project(camera);
      const val = document.createElement('div');
      val.className = 'val';
      val.textContent = `v = ${inst.v}`;
      val.style.left = `${x + (tmp.x * 0.5 + 0.5) * cw}px`;
      val.style.top = `${yTop + (1 - (tmp.y * 0.5 + 0.5)) * ch}px`;
      labels.appendChild(val);
    });
  });
}
render();
window.addEventListener('resize', render);
requestAnimationFrame(() => { window.sheetReady = true; });
</script>
</body>
</html>
